name: Gerar aplicativos

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build windows --release
      - name: Empacotar com runtime C++
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BenchTrack-windows-x64
          path: dist/BenchTrack-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configurar assinatura Android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          required = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configure os quatro secrets ANDROID_* descritos em docs/DISTRIBUTION.md.')
          Path('android/release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          def escape(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          properties = {'storeFile': 'release.jks', 'storePassword': os.environ['STORE_PASSWORD'],
                        'keyPassword': os.environ['KEY_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS']}
          Path('android/key.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in properties.items()), encoding='ascii')
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build apk --release
      - name: Preparar APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BenchTrack-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BenchTrack-android
          path: dist/BenchTrack-android.apk
          if-no-files-found: error
      - name: Remover assinatura do runner
        if: always()
        run: rm -f android/key.properties android/release.jks

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Gerar checksums
        run: cd dist && sha256sum BenchTrack-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/BenchTrack-windows-x64.zip
            dist/BenchTrack-android.apk
            dist/SHA256SUMS.txt
